{% extends "base.html" %}
{% block title %}Mis productos{% endblock %}

{% block content %}
<div class="dash-layout">
  <aside class="dash-sidebar">
    <div class="dash-sidebar__label">Seller Panel</div>
    <a href="/seller"          class="dash-link">📊 Overview</a>
    <a href="/seller/products" class="dash-link active">📦 Products</a>
    <a href="/seller/orders"   class="dash-link">🛒 Orders</a>
    <hr style="margin:12px 20px;border-color:var(--border)">
    <a href="/products" class="dash-link">🌐 Marketplace</a>
  </aside>
  <main class="dash-main">
    <div class="section-header">
      <div>
        <h1 style="font-size:1.5rem;font-weight:700;letter-spacing:-0.02em">Mis productos</h1>
        <p class="text-muted text-sm" id="prod-count"></p>
      </div>
      <button class="btn btn-primary btn-sm" onclick="openCreateForm()">+ Nuevo producto</button>
    </div>

    <!-- Create product form -->
    <div id="new-product-form" class="card" style="display:none;margin-bottom:24px">
      <div class="card-body">
        <h3 class="card-title" id="form-title">Create new product</h3>
        <div id="form-msg"></div>
        <form id="product-form">
          <input id="p-id" type="hidden" />
          <div class="form-grid-2">
            <div class="form-group" style="grid-column:1/-1">
              <label class="form-label">Title *</label>
              <input id="p-title" required minlength="3" />
            </div>
            <div class="form-group" style="grid-column:1/-1">
              <label class="form-label">Description *</label>
              <textarea id="p-desc" required minlength="10"></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">Price (satoshis) *</label>
              <input id="p-price" type="number" min="1" required placeholder="e.g. 50000" />
              <p class="form-hint" id="btc-hint"></p>
              <p class="form-hint" id="usd-hint" style="color:#16a34a;font-weight:500"></p>
            </div>
            <div class="form-group">
              <label class="form-label">Stock *</label>
              <input id="p-stock" type="number" min="0" required placeholder="0" />
            </div>
            <div class="form-group">
              <label class="form-label">Category *</label>
              <select id="p-category">
                <option>Electronics</option>
                <option>Books</option>
                <option>Art & Collectibles</option>
                <option>Gaming</option>
                <option>Home & Garden</option>
                <option>Other</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Tags (comma separated)</label>
              <input id="p-tags" placeholder="bitcoin, hardware, rare" />
            </div>
            <div class="form-group" style="grid-column:1/-1">
              <label class="form-label">Product images (optional, up to 2)</label>
              <input id="p-images" type="file" accept="image/*" multiple />
              <p class="form-hint">JPG, PNG, WEBP or GIF. Max 5MB each.</p>
              <p class="form-hint" id="current-image"></p>
            </div>
          </div>
          <div style="display:flex;gap:10px;margin-top:8px">
            <button type="submit" class="btn btn-primary" id="create-btn">Create product</button>
            <button type="button" class="btn btn-ghost" onclick="closeForm()">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Products table -->
    <div id="products-wrap">
      <div style="text-align:center;padding:40px"><div class="spinner"></div></div>
    </div>
  </main>
</div>
{% endblock %}

{% block scripts %}
<script>
if (!auth.isLoggedIn() || auth.user?.role !== 'seller') window.location.href = '/login';

function openCreateForm() {
  resetProductForm();
  document.getElementById('new-product-form').style.display = 'block';
}

function closeForm() {
  document.getElementById('new-product-form').style.display = 'none';
}

function resetProductForm() {
  document.getElementById('product-form').reset();
  document.getElementById('p-id').value = '';
  document.getElementById('form-title').textContent = 'Create new product';
  document.getElementById('create-btn').textContent = 'Create product';
  document.getElementById('current-image').textContent = '';
  document.getElementById('btc-hint').textContent = '';
}

// Live BTC & USD preview
document.addEventListener('DOMContentLoaded', async () => {
  const priceInput = document.getElementById('p-price');
  
  // Obtener tasa BTC/USD al cargar la página
  const rate = await fetchBtcUsdRate();
  
  if (priceInput) {
    priceInput.addEventListener('input', async e => {
      const btcHint = document.getElementById('btc-hint');
      const usdHint = document.getElementById('usd-hint');
      const v = parseInt(e.target.value);
      
      if (v > 0) {
        btcHint.textContent = `≈ ${sats2btc(v)} BTC`;
        
        // Mostrar conversión a USD para El Salvador
        const currentRate = await fetchBtcUsdRate();
        const usdAmount = sats2usd(v, currentRate);
        if (usdAmount) {
          usdHint.textContent = `≈ $${usdAmount} USD (El Salvador)`;
        }
      } else {
        btcHint.textContent = '';
        usdHint.textContent = '';
      }
    });
  }
  
  loadMyProducts();
});

async function loadMyProducts() {
  const wrap = document.getElementById('products-wrap');
  try {
    const data = await apiFetch('/products/mine');
    window._productsById = Object.fromEntries(data.products.map(p => [p.id, p]));
    document.getElementById('prod-count').textContent = data.products.length + ' listings';
    if (!data.products.length) {
      wrap.innerHTML = '<div class="empty-state"><div class="empty-state__icon">📦</div><p>Aun no tienes productos. Crea tu primera publicacion.</p></div>';
      return;
    }
    // Obtener tasa USD actual para la tabla
    const currentRate = await fetchBtcUsdRate();
    
    wrap.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Action</th></tr></thead>
          <tbody>
            ${data.products.map(p => `
              <tr>
                <td><strong style="font-size:0.875rem">${p.title}</strong></td>
                <td class="text-muted text-sm">${p.category}</td>
                <td>
                  <div style="display:flex;flex-direction:column;gap:2px">
                    <span class="mono text-orange text-sm">⚡ ${p.price_sats.toLocaleString()} sats</span>
                    <span class="text-muted text-xs" style="color:#16a34a">≈ $${sats2usd(p.price_sats, currentRate)} USD</span>
                  </div>
                </td>
                <td>${p.stock}</td>
                <td>${statusPill(p.status)}</td>
                <td>
                  <div style="display:flex;gap:6px">
                    <a href="/products/${p.id}" class="btn btn-ghost btn-sm">View</a>
                    <button class="btn btn-primary btn-sm" onclick="editProduct('${p.id}')">Edit</button>
                    ${p.status === 'active'
                      ? `<button class="btn btn-danger btn-sm" onclick="toggleProductStatus('${p.id}','inactive')">Deactivate</button>`
                      : `<button class="btn btn-outline btn-sm" onclick="toggleProductStatus('${p.id}','active')">Activate</button>`
                    }
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  } catch(e) {
    wrap.innerHTML = '<div class="alert alert-error">Could not load products.</div>';
  }
}

function editProduct(id) {
  const p = window._productsById?.[id];
  if (!p) return;

  document.getElementById('p-id').value = p.id;
  document.getElementById('p-title').value = p.title || '';
  document.getElementById('p-desc').value = p.description || '';
  document.getElementById('p-price').value = p.price_sats || 0;
  document.getElementById('p-stock').value = p.stock ?? 0;
  document.getElementById('p-category').value = p.category || 'Other';
  document.getElementById('p-tags').value = (p.tags || []).join(', ');
  document.getElementById('form-title').textContent = 'Edit product';
  document.getElementById('create-btn').textContent = 'Save changes';
  document.getElementById('btc-hint').textContent = p.price_sats ? `≈ ${sats2btc(p.price_sats)} BTC` : '';
  
  // Mostrar USD al editar
  if (p.price_sats) {
    fetchBtcUsdRate().then(rate => {
      const usdHint = document.getElementById('usd-hint');
      const usdAmount = sats2usd(p.price_sats, rate);
      if (usdHint && usdAmount) {
        usdHint.textContent = `≈ $${usdAmount} USD (El Salvador)`;
      }
    });
  }

  const currentImage = (p.images && p.images.length) ? p.images[0] : null;
  const imageEl = document.getElementById('current-image');
  imageEl.innerHTML = currentImage
    ? `Current images: ${(p.images || []).map((img, idx) => `<a href="${img}" target="_blank" rel="noopener">image ${idx + 1}</a>`).join(' · ')}`
    : 'No image uploaded yet.';

  document.getElementById('new-product-form').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function uploadImages(files) {
  const imageUrls = [];
  for (const file of files) {
    const body = new FormData();
    body.append('image', file);

    const res = await fetch('/api/products/upload-image', {
      method: 'POST',
      headers: { Authorization: `Bearer ${auth.token}` },
      body,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || data.message || 'Image upload failed');
    imageUrls.push(data.image_url);
  }
  return imageUrls;
}

document.getElementById('product-form').addEventListener('submit', async e => {
  e.preventDefault();
  const editingId = document.getElementById('p-id').value;
  const isEdit = !!editingId;
  const btn = document.getElementById('create-btn');
  btn.disabled = true; btn.textContent = isEdit ? 'Saving…' : 'Creating…';
  clearMsg('form-msg');
  try {
    const cleanText = (value, maxLength, fieldLabel) => {
      const cleaned = String(value || '').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, '').trim();
      if (!cleaned) throw new Error(`${fieldLabel} es obligatorio.`);
      if (cleaned.length > maxLength) throw new Error(`${fieldLabel} excede el maximo permitido.`);
      if (/[<>]/.test(cleaned)) throw new Error(`${fieldLabel} contiene caracteres no permitidos.`);
      return cleaned;
    };

    const title = cleanText(document.getElementById('p-title').value, 200, 'Titulo');
    const description = cleanText(document.getElementById('p-desc').value, 5000, 'Descripcion');
    const category = cleanText(document.getElementById('p-category').value, 60, 'Categoria');
    const price = parseInt(document.getElementById('p-price').value, 10);
    const stock = parseInt(document.getElementById('p-stock').value, 10);

    if (!Number.isInteger(price) || price <= 0 || price > 100000000000) {
      throw new Error('Precio invalido.');
    }
    if (!Number.isInteger(stock) || stock < 0 || stock > 1000000) {
      throw new Error('Stock invalido.');
    }

    const tags = document.getElementById('p-tags').value
      .split(',')
      .map(t => t.trim().toLowerCase())
      .filter(Boolean);
    if (tags.length > 15) throw new Error('Maximo 15 tags permitidos.');
    if (tags.some(t => t.length > 30 || /[<>]/.test(t))) {
      throw new Error('Tags invalidos.');
    }

    const imageInput = document.getElementById('p-images');
    const imageFiles = Array.from(imageInput?.files || []);
    if (imageFiles.length > 2) {
      throw new Error('Solo puedes subir hasta 2 imagenes por producto.');
    }
    if (imageFiles.length) {
      const maxBytes = 5 * 1024 * 1024;
      const allowedTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
      for (const imageFile of imageFiles) {
        if (!allowedTypes.includes(imageFile.type)) throw new Error('Formato de imagen no permitido.');
        if (imageFile.size > maxBytes) throw new Error('Una imagen supera 5MB.');
      }
    }

    if (isEdit) {
      // Edicion por JSON; si se suben imagenes nuevas se reemplaza el arreglo completo.
      const payload = {
        title,
        description,
        price_sats: price,
        stock,
        category,
        tags,
      };
      if (imageFiles.length) {
        payload.images = await uploadImages(imageFiles);
      }
      await apiFetch(`/products/${editingId}`, {
        method: 'PUT',
        body: JSON.stringify(payload)
      });
      showSuccess('form-msg', '✓ Product updated!');
    } else {
      // Crear producto: enviar todo como FormData
      const formData = new FormData();
      formData.append('title', title);
      formData.append('description', description);
      formData.append('price_sats', String(price));
      formData.append('stock', String(stock));
      formData.append('category', category);
      formData.append('tags', tags.join(','));
      imageFiles.forEach(file => formData.append('images', file));
      const res = await fetch('/api/products', {
        method: 'POST',
        headers: { Authorization: `Bearer ${auth.token}` },
        body: formData,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || data.message || 'Error creating product');
      showSuccess('form-msg', '✓ Product created!');
    }
    setTimeout(() => {
      closeForm();
      resetProductForm();
      loadMyProducts();
    }, 700);
  } catch(e) {
    showError('form-msg', e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = isEdit ? 'Save changes' : 'Create product';
  }
});

async function toggleProductStatus(id, newStatus) {
  const label = newStatus === 'inactive' ? 'Deactivate' : 'Activate';
  const confirmed = await confirmAction(`¿${label === 'Deactivate' ? 'Desactivar' : 'Activar'} este producto?`, {
    title: 'Confirmar cambio',
    confirmText: label === 'Deactivate' ? 'Desactivar' : 'Activar',
  });
  if (!confirmed) return;
  try {
    await apiFetch(`/products/${id}`, {
      method: 'PUT',
      body: JSON.stringify({ status: newStatus })
    });
    showToast('Estado actualizado correctamente', 'success');
    loadMyProducts();
  } catch(e) { showToast(e.message || 'No se pudo actualizar el estado', 'error'); }
}
</script>
{% endblock %}
