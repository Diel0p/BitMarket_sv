<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}BitMarket SV{% endblock %} — ⚡ Bitcoin Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css?v=20260618b" />
  {% block head %}{% endblock %}
</head>
<body>

<!-- ── Navbar ─────────────────────────────────────────── -->
<header class="navbar">
  <div class="container navbar__inner">
    <a href="/" class="navbar__logo">
      <img src="/static/img/bitmarket-logo.png" alt="BitMarket SV" class="navbar__logo-img" />
    </a>

    <form id="search-form" class="navbar__search">
      <input id="search-input" type="text" placeholder="Search products..." data-i18n-placeholder="nav.search_placeholder" />
      <button type="submit" class="navbar__search-btn">🔍</button>
    </form>

    <button type="button" class="navbar__icon-btn navbar__search-toggle" id="navbar-search-toggle" aria-label="Buscar">🔍</button>

    <nav class="navbar__actions" id="navbar-auth">
      <!-- hydrated by app.js -->
      <a href="/nosotros" class="navbar__link" data-i18n="nav.about">About us</a>
      <a href="/cart" class="navbar__link" id="cart-nav-link" title="Cart" data-i18n-title="nav.cart" style="display:none">🛒</a>
      <a href="/login" class="navbar__link" data-i18n="nav.login">Login</a>
      <a href="/register" class="navbar__btn" data-i18n="nav.signup">Sign up</a>
      <label class="navbar__lang" title="Language">
        <select id="lang-switcher" class="navbar__lang-select" onchange="window.i18nSetLang(this.value)">
          <option value="en">EN</option>
          <option value="es">ES</option>
        </select>
      </label>
    </nav>

    <button type="button" class="navbar__hamburger" id="navbar-hamburger" aria-label="Abrir menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>

  <form id="search-form-mobile" class="navbar__search-mobile">
    <input id="search-input-mobile" type="text" placeholder="Search products…" />
    <button type="submit" class="navbar__search-btn">🔍</button>
  </form>
</header>
<div class="page-overlay" id="page-overlay"></div>

<!-- ── Page content ──────────────────────────────────── -->
{% block content %}{% endblock %}

<!-- ── Footer ────────────────────────────────────────── -->
<footer class="site-footer">
  <div class="container site-footer__inner">
    <div class="site-footer__brand">
      <h3>BitMarket SV</h3>
      <p data-i18n="footer.built_by">Built by Cubo+ students.</p>
      <div class="site-footer__social">
        <a href="#" aria-label="X" class="icon-link">𝕏</a>
        <a href="#" aria-label="Nostr" class="icon-link">◎</a>
        <a href="#" aria-label="YouTube" class="icon-link">▶</a>
      </div>
      <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:10px;align-items:center">
        <a href="/donate" class="btn btn-sm" style="background:#f7931a;color:#fff;display:inline-flex;align-items:center;gap:8px;font-weight:600">
          ⚡ <span data-i18n="footer.support_project">Support the project</span>
        </a>
        <a href="/referrals" class="btn btn-sm btn-outline" style="display:inline-flex;align-items:center;gap:8px;font-weight:600">
          🎁 SatBack Referrals
        </a>
      </div>
      <p style="font-size:0.75rem;margin-top:8px;color:var(--text-3)" data-i18n="footer.lightning_donations">Bitcoin Lightning donations</p>
    </div>

  </div>
</footer>

<script src="/static/js/app.js?v=20260618001"></script>
{% block scripts %}{% endblock %}
</body>
</html>
