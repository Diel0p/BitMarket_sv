{% extends "base.html" %}
{% block title %}Admin — Productos{% endblock %}

{% block content %}
<div class="dash-layout">
  <aside class="dash-sidebar">
    <div class="dash-sidebar__label">Admin Panel</div>
    <a href="/admin"          class="dash-link">📊 Overview</a>
    <a href="/admin/users"    class="dash-link">👥 Users</a>
    <a href="/admin/products" class="dash-link active">📦 Products</a>
    <a href="/admin/orders"   class="dash-link">🛒 Orders</a>
    <hr style="margin:12px 20px;border-color:var(--border)">
    <a href="/products" class="dash-link">🌐 Marketplace</a>
  </aside>
  <main class="dash-main">
    <div class="section-header">
      <h1 style="font-size:1.5rem;font-weight:700;letter-spacing:-0.02em">Productos</h1>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="filterStatus('',this)">Todos</button>
        <button class="btn btn-ghost btn-sm" onclick="filterStatus('active',this)">Activos</button>
        <button class="btn btn-ghost btn-sm" onclick="filterStatus('inactive',this)">Inactivos</button>
        <button class="btn btn-ghost btn-sm" onclick="filterStatus('pending',this)">Pendientes</button>
      </div>
    </div>
    <div id="products-wrap">
      <div style="text-align:center;padding:40px"><div class="spinner"></div></div>
    </div>
  </main>
</div>
{% endblock %}

{% block scripts %}
<script>
if (!auth.isLoggedIn() || auth.user?.role !== 'admin') window.location.href = '/login';

let currentStatus = '';

function filterStatus(s, btn) {
  currentStatus = s;
  document.querySelectorAll('.dash-main .btn-ghost, .dash-main .btn-primary').forEach(b => {
    b.classList.remove('btn-primary'); b.classList.add('btn-ghost');
  });
  if (btn) { btn.classList.remove('btn-ghost'); btn.classList.add('btn-primary'); }
  loadProducts();
}

async function loadProducts() {
  const wrap = document.getElementById('products-wrap');
  wrap.innerHTML = '<div style="text-align:center;padding:24px"><div class="spinner"></div></div>';
  try {
    const qs = currentStatus ? `?status=${currentStatus}` : '';
    const data = await apiFetch('/admin/products' + qs);
    if (!data.products.length) {
      wrap.innerHTML = '<div class="empty-state"><div class="empty-state__icon">📦</div><p>No se encontraron productos.</p></div>';
      return;
    }
    wrap.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Producto</th><th>Vendedor</th><th>Categoria</th><th>Precio</th><th>Stock</th><th>Estado</th><th>Acciones</th></tr></thead>
          <tbody>
            ${data.products.map(p => `
              <tr>
                <td style="max-width:200px">
                  <p style="font-weight:500;font-size:0.875rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.title}</p>
                </td>
                <td class="text-muted text-sm">${p.seller_name || '—'}</td>
                <td class="text-muted text-sm">${p.category}</td>
                <td><span class="mono text-sm text-orange">⚡ ${p.price_sats.toLocaleString()}</span></td>
                <td class="text-sm">${p.stock}</td>
                <td>${statusPill(p.status)}</td>
                <td>
                  <div style="display:flex;gap:4px;flex-wrap:wrap">
                    <a href="/products/${p.id}" class="btn btn-ghost btn-sm">Ver</a>
                    ${p.status !== 'active'   ? `<button class="btn btn-sm btn-outline" onclick="setStatus('${p.id}','active')">Aprobar</button>` : ''}
                    ${p.status !== 'inactive' ? `<button class="btn btn-danger btn-sm" onclick="setStatus('${p.id}','inactive')">Desactivar</button>` : ''}
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      <p class="text-muted text-sm" style="margin-top:12px">${data.total} producto(s) en total</p>
    `;
  } catch(e) {
    wrap.innerHTML = '<div class="alert alert-error">' + e.message + '</div>';
  }
}

async function setStatus(id, status) {
  try {
    await apiFetch(`/admin/products/${id}/status`, {
      method: 'PATCH',
      body: JSON.stringify({ status })
    });
    showToast('Estado del producto actualizado', 'success');
    loadProducts();
  } catch(e) { showToast(e.message || 'No se pudo actualizar el producto', 'error'); }
}

document.addEventListener('DOMContentLoaded', loadProducts);
</script>
{% endblock %}
