{% extends "base.html" %}
{% block title %}Admin — Usuarios{% endblock %}

{% block content %}
<div class="dash-layout">
  <aside class="dash-sidebar">
    <div class="dash-sidebar__label">Admin Panel</div>
    <a href="/admin"          class="dash-link">📊 Overview</a>
    <a href="/admin/users"    class="dash-link active">👥 Users</a>
    <a href="/admin/products" class="dash-link">📦 Products</a>
    <a href="/admin/orders"   class="dash-link">🛒 Orders</a>
    <hr style="margin:12px 20px;border-color:var(--border)">
    <a href="/products" class="dash-link">🌐 Marketplace</a>
  </aside>
  <main class="dash-main">
    <div class="section-header">
      <h1 style="font-size:1.5rem;font-weight:700;letter-spacing:-0.02em">Usuarios</h1>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary btn-sm" onclick="openCreateSuperModal()">+ Super usuario</button>
        <button class="btn btn-ghost btn-sm" onclick="filterRole('',this)">Todos</button>
        <button class="btn btn-ghost btn-sm" onclick="filterRole('buyer',this)">Compradores</button>
        <button class="btn btn-ghost btn-sm" onclick="filterRole('seller',this)">Vendedores</button>
        <button class="btn btn-ghost btn-sm" onclick="filterRole('admin',this)">Admins</button>
      </div>
    </div>
    <div id="users-wrap">
      <div style="text-align:center;padding:40px"><div class="spinner"></div></div>
    </div>

    <div id="user-detail-modal" class="modal-overlay" style="display:none" onclick="closeUserDetail(event)">
      <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-head">
          <h3 id="detail-name" style="margin:0;font-size:1.05rem">Detalle de usuario</h3>
          <button class="btn btn-ghost btn-sm" onclick="closeUserDetail()">Cerrar</button>
        </div>
        <div id="detail-body" class="detail-grid"></div>
      </div>
    </div>

    <div id="create-super-modal" class="modal-overlay" style="display:none" onclick="closeCreateSuperModal(event)">
      <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-head">
          <h3 style="margin:0;font-size:1.05rem">Crear super usuario</h3>
          <button class="btn btn-ghost btn-sm" onclick="closeCreateSuperModal()">Cerrar</button>
        </div>
        <div style="padding:16px">
          <div id="super-msg"></div>
          <form id="super-form" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="form-group" style="grid-column:1/-1">
              <label class="form-label">Nombre</label>
              <input id="su-name" required minlength="2" />
            </div>
            <div class="form-group">
              <label class="form-label">Email</label>
              <input id="su-email" type="email" required />
            </div>
            <div class="form-group">
              <label class="form-label">Password</label>
              <input id="su-password" type="password" minlength="8" required />
            </div>
            <div class="form-group">
              <label class="form-label">Telefono</label>
              <input id="su-phone" type="tel" />
            </div>
            <div class="form-group">
              <label class="form-label">Departamento</label>
              <select id="su-department">
                <option value="">Seleccionar</option>
                <option value="Ahuachapan">Ahuachapan</option>
                <option value="Cabanas">Cabanas</option>
                <option value="Chalatenango">Chalatenango</option>
                <option value="Cuscatlan">Cuscatlan</option>
                <option value="La Libertad">La Libertad</option>
                <option value="La Paz">La Paz</option>
                <option value="La Union">La Union</option>
                <option value="Morazan">Morazan</option>
                <option value="San Miguel">San Miguel</option>
                <option value="San Salvador">San Salvador</option>
                <option value="San Vicente">San Vicente</option>
                <option value="Santa Ana">Santa Ana</option>
                <option value="Sonsonate">Sonsonate</option>
                <option value="Usulutan">Usulutan</option>
              </select>
            </div>
            <div class="form-group" style="grid-column:1/-1">
              <label class="form-label">Direccion</label>
              <input id="su-address" />
            </div>
            <div style="grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end">
              <button type="button" class="btn btn-ghost" onclick="closeCreateSuperModal()">Cancelar</button>
              <button type="submit" class="btn btn-primary" id="super-btn">Crear super usuario</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>
{% endblock %}

{% block scripts %}
<script>
if (!auth.isLoggedIn() || auth.user?.role !== 'admin') window.location.href = '/login';

let currentRole = '';
let userIndex = {};

function formatPhoneInput(value) {
  const raw = (value || '').trim();
  const digits = raw.replace(/\D/g, '');
  if (!digits) return '';

  if (raw.startsWith('+') || digits.startsWith('503')) {
    const local = (digits.startsWith('503') ? digits.slice(3) : digits).slice(0, 8);
    if (local.length <= 4) return `+503 ${local}`;
    return `+503 ${local.slice(0, 4)}-${local.slice(4)}`;
  }

  const local = digits.slice(0, 8);
  if (local.length <= 4) return local;
  return `${local.slice(0, 4)}-${local.slice(4)}`;
}

function isValidSvPhone(value) {
  return /^(?:\+503\s?)?[267]\d{3}-?\d{4}$/.test((value || '').trim());
}

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}

function filterRole(role, btn) {
  currentRole = role;
  document.querySelectorAll('.dash-main .btn-ghost').forEach(b => b.classList.remove('btn-primary'));
  if (btn) btn.classList.add('btn-primary');
  loadUsers();
}

async function loadUsers() {
  const wrap = document.getElementById('users-wrap');
  wrap.innerHTML = '<div style="text-align:center;padding:24px"><div class="spinner"></div></div>';
  try {
    const qs = currentRole ? `?role=${currentRole}` : '';
    const data = await apiFetch('/admin/users' + qs);
    userIndex = Object.fromEntries(data.users.map(u => [u.id, u]));
    if (!data.users.length) {
      wrap.innerHTML = '<div class="empty-state"><div class="empty-state__icon">👥</div><p>No se encontraron usuarios.</p></div>';
      return;
    }
    wrap.innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Email</th><th>Telefono</th><th>Rol</th><th>Registro</th><th>Estado</th><th>Acciones</th></tr></thead>
          <tbody>
            ${data.users.map(u => `
              <tr>
                <td>
                  <div style="display:flex;align-items:center;gap:10px">
                    <div style="width:30px;height:30px;border-radius:50%;background:var(--orange-glow);border:1px solid rgba(247,147,26,0.3);color:var(--orange);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.8rem;flex-shrink:0">${u.name[0].toUpperCase()}</div>
                    <span style="font-weight:500;font-size:0.875rem">${u.name}</span>
                  </div>
                </td>
                <td class="mono text-sm" style="color:var(--text-2)">${u.email}</td>
                <td class="text-sm">${u.phone ? esc(u.phone) : '<span class="text-muted">—</span>'}</td>
                <td><span class="navbar__role-badge badge-${u.role}">${u.role}</span></td>
                <td class="text-muted text-sm">${new Date(u.created_at).toLocaleDateString()}</td>
                <td>${u.is_active ? '<span class="pill pill-active">Activo</span>' : '<span class="pill pill-failed">Baneado</span>'}</td>
                <td>
                  <div style="display:flex;gap:6px;flex-wrap:wrap">
                    <button class="btn btn-ghost btn-sm" onclick="showUserDetail('${u.id}')">Ver mas</button>
                    ${u.role !== 'admin' ? `
                      <button class="btn btn-sm ${u.is_active ? 'btn-danger' : 'btn-ghost'}" onclick="toggleUser('${u.id}')">
                        ${u.is_active ? 'Banear' : 'Desbanear'}
                      </button>
                    ` : ''}
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      <p class="text-muted text-sm" style="margin-top:12px">${data.total} usuario(s) en total</p>
    `;
  } catch(e) {
    wrap.innerHTML = '<div class="alert alert-error">' + e.message + '</div>';
  }
}

function showUserDetail(id) {
  const u = userIndex[id];
  if (!u) return;
  document.getElementById('detail-name').textContent = `Detalle de ${u.name}`;
  document.getElementById('detail-body').innerHTML = `
    <div><span class="detail-label">Nombre</span><span>${esc(u.name)}</span></div>
    <div><span class="detail-label">Email</span><span class="mono">${esc(u.email)}</span></div>
    <div><span class="detail-label">Rol</span><span>${esc(u.role)}</span></div>
    <div><span class="detail-label">Telefono</span><span>${u.phone ? esc(u.phone) : '—'}</span></div>
    <div><span class="detail-label">Direccion</span><span>${u.address ? esc(u.address) : '—'}</span></div>
    <div><span class="detail-label">Departamento</span><span>${u.department ? esc(u.department) : '—'}</span></div>
    <div><span class="detail-label">Tienda</span><span>${u.store_name ? esc(u.store_name) : '—'}</span></div>
    <div><span class="detail-label">Lightning</span><span class="mono">${u.lightning_address ? esc(u.lightning_address) : '—'}</span></div>
    <div><span class="detail-label">Estado</span><span>${u.is_active ? 'Activo' : 'Baneado'}</span></div>
    <div><span class="detail-label">Creado</span><span>${u.created_at ? new Date(u.created_at).toLocaleString() : '—'}</span></div>
  `;
  document.getElementById('user-detail-modal').style.display = 'flex';
}

function closeUserDetail(event) {
  if (event && event.target && event.target.closest('.modal-card')) return;
  document.getElementById('user-detail-modal').style.display = 'none';
}

function openCreateSuperModal() {
  clearMsg('super-msg');
  document.getElementById('super-form').reset();
  const phoneInput = document.getElementById('su-phone');
  if (phoneInput) {
    phoneInput.oninput = e => {
      e.target.value = formatPhoneInput(e.target.value);
      if (e.target.value && !isValidSvPhone(e.target.value)) {
        e.target.setCustomValidity('Numero invalido. Usa 7000-0000 o 2223-4567 (con o sin +503).');
      } else {
        e.target.setCustomValidity('');
      }
    };
    phoneInput.placeholder = '7000-0000';
    phoneInput.pattern = '^(?:\\+503\\s?)?[267]\\d{3}-?\\d{4}$';
    phoneInput.title = 'Usa formato salvadoreno de 8 digitos: 7000-0000 o 2223-4567';
  }
  document.getElementById('create-super-modal').style.display = 'flex';
}

function closeCreateSuperModal(event) {
  if (event && event.target && event.target.closest('.modal-card')) return;
  document.getElementById('create-super-modal').style.display = 'none';
}

document.getElementById('super-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('super-btn');
  btn.disabled = true;
  btn.textContent = 'Creando...';
  clearMsg('super-msg');
  try {
    const cleanText = (value, maxLength, field, { required = false } = {}) => {
      const cleaned = String(value || '').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, '').trim();
      if (!cleaned) {
        if (required) throw new Error(`${field} es obligatorio.`);
        return '';
      }
      if (/[<>]/.test(cleaned)) throw new Error(`${field} contiene caracteres no permitidos.`);
      if (cleaned.length > maxLength) throw new Error(`${field} excede el maximo permitido.`);
      return cleaned;
    };

    const name = cleanText(document.getElementById('su-name').value, 100, 'Nombre', { required: true });
    const email = cleanText(document.getElementById('su-email').value, 160, 'Correo', { required: true }).toLowerCase();
    const password = String(document.getElementById('su-password').value || '').trim();

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      throw new Error('Correo invalido.');
    }
    if (
      password.length < 8 ||
      !/[A-Z]/.test(password) ||
      !/[a-z]/.test(password) ||
      !/\d/.test(password) ||
      !/[^A-Za-z0-9]/.test(password) ||
      /\s/.test(password)
    ) {
      throw new Error('La contrasena debe tener 8+ caracteres, mayuscula, minuscula, numero y simbolo, sin espacios.');
    }

    const payload = {
      name,
      email,
      password,
    };
    const phone = document.getElementById('su-phone').value.trim();
    const department = document.getElementById('su-department').value;
    const address = cleanText(document.getElementById('su-address').value, 255, 'Direccion');
    if (phone) {
      if (!isValidSvPhone(phone)) {
        throw new Error('Numero invalido. Usa 7000-0000 o 2223-4567 (con o sin +503).');
      }
      payload.phone = phone;
    }
    if (department) payload.department = cleanText(department, 80, 'Departamento');
    if (address) payload.address = address;

    await apiFetch('/admin/users/super', {
      method: 'POST',
      body: JSON.stringify(payload),
    });

    showSuccess('super-msg', 'Super usuario creado correctamente');
    setTimeout(() => {
      closeCreateSuperModal();
      loadUsers();
    }, 700);
  } catch (e) {
    showError('super-msg', e.message || 'No se pudo crear el super usuario');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Crear super usuario';
  }
});

async function toggleUser(id) {
  try {
    await apiFetch(`/admin/users/${id}/status`, { method: 'PATCH' });
    showToast('Estado de usuario actualizado', 'success');
    loadUsers();
  } catch(e) { showToast(e.message || 'No se pudo actualizar usuario', 'error'); }
}

document.addEventListener('DOMContentLoaded', loadUsers);
</script>

<style>
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 60;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-card {
  width: min(760px, 100%);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 18px;
  padding: 16px;
}
.detail-grid > div {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}
.detail-label {
  font-size: 0.75rem;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.modal-card .form-group { margin-bottom: 0; }
@media (max-width: 760px) {
  .detail-grid { grid-template-columns: 1fr; }
}
</style>
{% endblock %}
