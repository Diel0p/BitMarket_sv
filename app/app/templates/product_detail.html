{% extends "base.html" %}
{% block title %}Product{% endblock %}

{% block content %}
<div class="container page" id="product-page">
  <div style="text-align:center;padding:60px"><div class="spinner"></div></div>
</div>
{% endblock %}

{% block scripts %}
<script>
const productId = location.pathname.split('/').pop();

async function loadProduct() {
  // Obtener tasa BTC/USD
  const rate = await fetchBtcUsdRate();
  const page = document.getElementById('product-page');
  try {
    const data = await apiFetch(`/products/${productId}`);
    const p = data.product;
    const emoji = { Electronics:'💻', Books:'📚', Art:'🎨', Gaming:'🎮', 'Art & Collectibles':'🎨' }[p.category] || '📦';
    const images = Array.isArray(p.images) ? p.images.filter(Boolean) : [];
    const coverImage = images.length ? images[0] : null;
    const canBuy = auth.isLoggedIn() && auth.user?.role === 'buyer';
    const needLogin = !auth.isLoggedIn();
    const thumbs = images.length > 1
      ? `<div class="product-detail__thumbs">${images.map((img, idx) => `<button type="button" class="product-thumb ${idx === 0 ? 'active' : ''}" onclick="setMainImage('${img.replace(/'/g, "\\'")}', this)"><img src="${img}" alt="${p.title} angle ${idx + 1}" /></button>`).join('')}</div>`
      : '';

    page.innerHTML = `
      <a href="/products" class="text-muted text-sm" style="display:inline-block;margin-bottom:24px">← Back to products</a>
      <div class="product-detail fade-in">
        <div class="product-detail__gallery">
          <div class="product-detail__img">${coverImage
            ? `<img id="main-product-image" src="${coverImage}" alt="${p.title}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit" />`
            : emoji}
          </div>
          ${thumbs}
        </div>
        <div class="product-detail__info">
          <p class="product-card__cat">${p.category}</p>
          <h1 class="product-detail__title">${p.title}</h1>
          <p class="text-muted text-sm">Sold by <strong style="color:var(--text-1)">${p.seller_name || 'Unknown'}</strong></p>
          ${p.seller_store_location
            ? `<div class="store-location-box">
                <p class="text-muted text-sm" style="margin:0 0 8px 0">Store location: <strong style="color:var(--text-1)">${p.seller_store_location}</strong></p>
                ${canBuy
                  ? `<button class="btn btn-outline btn-sm" onclick="openSellerMap()">Ver tienda en mapa</button>`
                  : '<p class="text-muted text-sm" style="margin:0">Inicia sesion como comprador para abrir el mapa.</p>'
                }
              </div>`
            : ''}

          <div class="price-box">
            <div>
              <span style="font-size:0.9rem;color:var(--text-2)">⚡ </span>
              <span class="price-sats" style="font-size:2rem">${p.price_sats.toLocaleString()}</span>
              <span class="price-unit"> sats</span>
            </div>
            <p class="text-muted text-sm mono" style="margin-top:4px">≈ ${sats2btc(p.price_sats)} BTC</p>
            <p class="text-sm" style="margin-top:2px;color:#16a34a;font-weight:500" id="price-usd">Cargando precio USD...</p>
          </div>

          <div class="stock-indicator ${p.stock === 0 ? 'out' : p.stock < 5 ? 'low' : 'ok'}">
            ${p.stock === 0 ? '✗ Out of stock' : p.stock < 5 ? `⚠ Only ${p.stock} left` : `✓ In stock (${p.stock})`}
          </div>

          <div style="display:flex;align-items:center;gap:12px;margin:20px 0">
            <div class="qty-control">
              <button onclick="changeQty(-1)">−</button>
              <span id="qty">1</span>
              <button onclick="changeQty(1)">+</button>
            </div>
            ${p.stock > 0 && canBuy
              ? `<button class="btn btn-primary" style="flex:1" onclick="buyNow()">⚡ Buy now</button>
                 <button class="btn btn-outline" style="flex:1" onclick="addToCart()">🛒 Add to cart</button>`
              : p.stock > 0 && needLogin
              ? `<a href="/login" class="btn btn-outline" style="flex:1">Login to buy</a>`
              : p.stock === 0
              ? `<button class="btn btn-ghost" disabled style="flex:1">Out of stock</button>`
              : `<button class="btn btn-ghost" disabled style="flex:1">Buyers only</button>`
            }
          </div>

          <div class="product-detail__desc">
            <h3>About this product</h3>
            <p>${p.description}</p>
          </div>

          ${p.tags.length ? `<div class="tags-row">${p.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div>` : ''}
        </div>
      </div>
    `;
    window._product = p;
  } catch(e) {
    page.innerHTML = '<p class="text-muted">Product not found.</p>';
  }
}

let qty = 1;

function setMainImage(url, thumbEl) {
  const main = document.getElementById('main-product-image');
  if (!main) return;
  main.src = url;

  document.querySelectorAll('.product-thumb').forEach(el => el.classList.remove('active'));
  if (thumbEl) thumbEl.classList.add('active');
}

function resolveMapUrl(locationText) {
  const value = (locationText || '').trim();
  if (!value) return null;
  if (/^https?:\/\//i.test(value)) return value;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(value)}`;
}

function openSellerMap() {
  const locationText = window._product?.seller_store_location;
  const mapUrl = resolveMapUrl(locationText);
  if (!mapUrl) {
    showToast('Este vendedor no tiene ubicacion registrada.', 'info');
    return;
  }
  window.open(mapUrl, '_blank', 'noopener');
}

function changeQty(dir) {
  const stock = window._product?.stock || 1;
  qty = Math.max(1, Math.min(stock, qty + dir));
  const qtyEl = document.getElementById('qty');
  if (qtyEl) qtyEl.textContent = qty;
}

async function addToCart() {
  if (!auth.isLoggedIn()) { window.location.href = '/login'; return; }
  const p = window._product;
  if (!p) return;
  try {
    await apiFetch('/cart/items', {
      method: 'POST',
      body: JSON.stringify({ product_id: p.id, quantity: qty }),
    });
    window.refreshCartCount?.();
    showCartAddedPrompt();
  } catch(e) {
    showToast(e.message || 'No se pudo agregar al carrito', 'error');
  }
}

function showCartAddedPrompt() {
  const existing = document.getElementById('cart-added-toast');
  if (existing) existing.remove();

  const toast = document.createElement('div');
  toast.id = 'cart-added-toast';
  toast.className = 'cart-added-toast fade-in';
  toast.innerHTML = `
    <p>Producto agregado al carrito.</p>
    <div class="cart-added-toast__actions">
      <button class="btn btn-ghost btn-sm" id="continue-shopping-btn">Seguir comprando</button>
      <a href="/cart" class="btn btn-primary btn-sm">Ir al carrito</a>
    </div>
  `;
  document.body.appendChild(toast);

  document.getElementById('continue-shopping-btn').addEventListener('click', () => {
    toast.remove();
  });
}

async function buyNow() {
  if (!auth.isLoggedIn()) { window.location.href = '/login'; return; }
  const p = window._product;
  if (!p) return;
  try {
    const order = await apiFetch('/orders', {
      method: 'POST',
      body: JSON.stringify({
        items: [{ product_id: p.id, quantity: qty }],
        shipping_address: {
          name: auth.user?.name || 'Buyer',
          street: 'TBD',
          city: 'TBD',
          country: 'TBD',
        },
      }),
    });
    window.location.href = `/checkout/${order.order_id}?hash=${order.invoice.payment_hash}&amount=${order.invoice.amount_sats}&mock=${order.invoice.is_mock}`;
  } catch(e) {
    showToast(e.message || 'No se pudo crear la orden', 'error');
  }
}

document.addEventListener('DOMContentLoaded', loadProduct);
</script>

<style>
.product-detail {
  display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: start;
}
.product-detail__img {
  aspect-ratio: 4/3; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  display: flex; align-items: center; justify-content: center; font-size: 5rem;
}
.product-detail__thumbs {
  margin-top: 10px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.product-thumb {
  width: 86px;
  height: 70px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  padding: 0;
  background: var(--bg-surface);
}
.product-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.product-thumb.active {
  border-color: var(--orange);
  box-shadow: 0 0 0 1px rgba(247,147,26,0.3);
}
.product-detail__title { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; margin: 8px 0; }
.price-box {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 20px; margin: 16px 0;
}
.stock-indicator { font-size: 0.875rem; font-weight: 600; padding: 8px 12px; border-radius: var(--radius-sm); }
.stock-indicator.ok  { background: rgba(34,197,94,0.08);  color: var(--success); }
.stock-indicator.low { background: rgba(245,158,11,0.08); color: var(--warning); }
.stock-indicator.out { background: rgba(239,68,68,0.08);  color: var(--error); }
.store-location-box {
  margin: 12px 0 18px;
  padding: 12px;
  border: 1px dashed var(--border-md);
  border-radius: var(--radius-md);
  background: var(--bg-surface);
}
.qty-control {
  display: flex; align-items: center;
  border: 1px solid var(--border-md); border-radius: var(--radius-md); overflow: hidden;
}
.qty-control button {
  width: 40px; height: 44px; background: var(--bg-card); color: var(--text-1);
  font-size: 1.2rem; cursor: pointer; transition: background 0.15s;
  border: none; font-family: var(--font);
}
.qty-control button:hover { background: var(--bg-hover); }
.qty-control span {
  width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
  font-weight: 600; border-left: 1px solid var(--border); border-right: 1px solid var(--border);
}
.product-detail__desc h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; }
.product-detail__desc p { font-size: 0.9rem; color: var(--text-2); line-height: 1.7; white-space: pre-line; }
.tags-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.tag { font-size: 0.75rem; color: var(--text-3); background: var(--bg-surface); border: 1px solid var(--border); padding: 3px 10px; border-radius: 999px; }
.cart-added-toast {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 1100;
  background: var(--bg-card);
  border: 1px solid var(--border-md);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow);
  padding: 12px;
  min-width: 280px;
}
.cart-added-toast p {
  margin: 0 0 10px 0;
  font-size: 0.88rem;
}
.cart-added-toast__actions {
  display: flex;
  gap: 8px;
}
@media (max-width: 768px) { .product-detail { grid-template-columns: 1fr; gap: 24px; } }
</style>
{% endblock %}
