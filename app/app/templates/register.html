{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="page-narrow">
  <div class="auth-card card">
    <div class="card-body">
      <div class="auth-logo">⚡</div>
      <h1 class="auth-title">Create account</h1>
      <p class="text-muted text-sm" style="margin-bottom:20px;text-align:center">Join the Bitcoin marketplace</p>

      <!-- Role tabs -->
      <div class="role-tabs">
        <button class="role-tab active" data-role="buyer"  onclick="setRole('buyer',this)">🛒 Buyer</button>
        <button class="role-tab"        data-role="seller" onclick="setRole('seller',this)">🏪 Seller</button>
      </div>
      <input type="hidden" id="role-input" value="buyer" />

      <div id="msg"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label">Full name</label>
          <input type="text" id="name" placeholder="Your name" required />
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" placeholder="Min. 8 characters" minlength="8" required />
        </div>
        <div class="form-group" id="store-group" style="display:none">
          <label class="form-label">Store name</label>
          <input type="text" id="store-name" placeholder="Your awesome store" />
        </div>
        <div class="form-group" id="lightning-group" style="display:none">
          <label class="form-label">Lightning Address</label>
          <input type="text" id="lightning-address" placeholder="seller@yourdomain.com" />
          <p class="form-hint">Required for sellers so the platform can send payouts automatically.</p>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="submit-btn">Create account</button>
      </form>

      <p class="text-muted text-sm" style="text-align:center;margin-top:20px">
        Already have an account? <a href="/login" class="text-orange">Login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Pre-select role from URL param
const urlRole = new URLSearchParams(location.search).get('role');
if (urlRole) setRole(urlRole, document.querySelector(`[data-role="${urlRole}"]`));

function setRole(role, btn) {
  document.getElementById('role-input').value = role;
  document.querySelectorAll('.role-tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('store-group').style.display = role === 'seller' ? 'block' : 'none';
  document.getElementById('lightning-group').style.display = role === 'seller' ? 'block' : 'none';
}

document.getElementById('register-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner" style="width:16px;height:16px"></span>';
  clearMsg('msg');

  try {
    const payload = {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
      role: document.getElementById('role-input').value,
    };
    const sn = document.getElementById('store-name').value;
    if (sn) payload.store_name = sn;
    const lightningAddress = document.getElementById('lightning-address').value.trim();
    if (lightningAddress) payload.lightning_address = lightningAddress;

    const data = await apiFetch('/auth/register', { method: 'POST', body: JSON.stringify(payload) });
    auth.set(data.access_token, data.user);
    window.location.href = data.user.role === 'seller' ? '/seller' : '/products';
  } catch(e) {
    showError('msg', e.message || 'Registration failed');
    btn.disabled = false; btn.textContent = 'Create account';
  }
});
</script>

<style>
.auth-card { max-width: 420px; margin: 0 auto; }
.auth-logo { font-size: 2.4rem; text-align: center; margin-bottom: 8px; }
.auth-title { font-size: 1.5rem; font-weight: 700; text-align: center; letter-spacing: -0.02em; margin-bottom: 4px; }
.role-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
.role-tab {
  padding: 10px; border-radius: var(--radius-md);
  border: 1px solid var(--border); color: var(--text-2);
  font-size: 0.875rem; font-weight: 500; background: var(--bg-surface);
  transition: all 0.2s; cursor: pointer;
}
.role-tab.active {
  background: rgba(247,147,26,0.12); border-color: rgba(247,147,26,0.4);
  color: var(--orange); font-weight: 600;
}
</style>
{% endblock %}
